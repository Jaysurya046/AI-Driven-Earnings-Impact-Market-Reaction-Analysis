# Configuration file for Earnings Analysis System
# Modify these settings to customize the analysis

[DATA_COLLECTION]
# Number of years of historical data to fetch
lookback_years = 5

# Stock tickers to analyze
tickers = AAPL, MSFT, GOOGL, AMZN, TSLA, META, NVDA, JPM, JNJ, PG

[EVENT_ANALYSIS]
# Number of trading days before/after earnings to analyze
event_window = 5

# Number of trading days for baseline estimation period
estimation_window = 60

[FEATURE_ENGINEERING]
# Classification threshold for post-event returns
# Returns > threshold = positive reaction (1), else = negative (0)
label_threshold = 0.0

[MACHINE_LEARNING]
# Test set size (fraction)
test_size = 0.2

# Random seed for reproducibility
random_state = 42

# Models to train: logistic_regression, random_forest, xgboost
models_to_train = logistic_regression, random_forest, xgboost

[DIRECTORIES]
# Data directory path
data_dir = data

# Models directory path
models_dir = models

# Visualization directory path
viz_dir = visualizations

# Notebooks directory path
notebooks_dir = notebooks

[VISUALIZATION]
# Figure size (width, height) in inches
figure_size = 14, 8

# DPI for saved figures
dpi = 300

# Color scheme for plots
color_scheme = seaborn
